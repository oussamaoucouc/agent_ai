<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    
    <style>
      /* Custom Scrollbar Styling */
      /* For Webkit-based browsers (Chrome, Safari, new Edge) */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent; /* Makes the track invisible */
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(156, 163, 175, 0.4); /* Semi-transparent gray-400 */
        border-radius: 20px;
        border: 2px solid transparent;
        background-clip: content-box; /* Clips the background to the content box, creating padding */
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(156, 163, 175, 0.6); /* Semi-transparent gray-400 on hover */
      }

      /* For Firefox */
      html {
        scrollbar-width: thin;
        scrollbar-color: rgba(156, 163, 175, 0.4) transparent; /* thumb color track color */
      }
      
      body {
        background-color: #0f172a; /* slate-900 */
      }

      /* Custom Avatar Animation */
      @keyframes energetic-hover {
        0%, 100% {
          transform: translateY(0px) rotate(-1deg);
        }
        50% {
          transform: translateY(-12px) rotate(1deg);
        }
      }
      .animate-energetic-hover {
        animation: energetic-hover 5s ease-in-out infinite;
      }

      /* Animations for Speaking State */
      @keyframes floating {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .animate-floating {
        animation: floating 3s ease-in-out infinite;
      }


      /* Floating Aurora Blobs - enhanced for background */
       @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes gradient-fade {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .aurora-blob {
        position: absolute;
        filter: blur(100px); /* Increased blur for softer look */
        animation: gradient-fade 10s ease-in-out infinite alternate;
        will-change: transform, opacity;
      }
      .aurora-blob-1 {
        top: -15%; left: -15%; width: 55%; height: 55%;
        background: radial-gradient(circle at center, rgba(56, 189, 248, 0.4), transparent 70%); /* sky-400 */
        animation-duration: 15s;
        animation-name: rotate, gradient-fade;
      }
      .aurora-blob-2 {
        top: 10%; right: -20%; width: 60%; height: 60%;
        background: radial-gradient(circle at center, rgba(236, 72, 153, 0.3), transparent 70%); /* pink-500 */
        animation-duration: 20s;
         animation-name: rotate, gradient-fade;
      }
      .aurora-blob-3 {
        bottom: -20%; left: 20%; width: 45%; height: 45%;
        background: radial-gradient(circle at center, rgba(129, 140, 248, 0.4), transparent 70%); /* indigo-400 */
        animation-duration: 18s;
         animation-name: rotate, gradient-fade;
      }
       .aurora-blob-4 {
        bottom: -10%; right: 10%; width: 50%; height: 50%;
        background: radial-gradient(circle at center, rgba(34, 211, 238, 0.4), transparent 70%); /* cyan-400 */
        animation-duration: 22s;
        animation-name: rotate, gradient-fade;
      }


      /* Natural Blinking Animation */
      @keyframes blink {
        0%, 95% { transform: scaleY(1); }
        97.5% { transform: scaleY(0.1); }
        100% { transform: scaleY(1); }
      }
      .eye {
        transform-origin: center;
        animation: blink 7s infinite;
      }
      
      /* Subtle Glance for idle avatar */
      @keyframes subtle-glance {
        0%, 80%, 100% {
          transform: translateX(0);
        }
        85% {
          transform: translateX(-0.8px); /* SVG units */
        }
        95% {
          transform: translateX(0.8px); /* SVG units */
        }
      }
      .animate-subtle-glance {
        animation: subtle-glance 8s infinite ease-in-out;
      }

      /* Thinking pulse for avatar glow */
      @keyframes thinking-pulse {
        0%, 100% {
            transform: scale(0.9);
            opacity: 0.7;
        }
        50% {
            transform: scale(1.1);
            opacity: 1;
        }
      }
       @keyframes glow-pulse {
        0%, 100% {
            box-shadow: 0 0 40px rgba(14, 165, 233, 0.6), 0 0 60px rgba(14, 165, 233, 0.5);
        }
        50% {
            box-shadow: 0 0 55px rgba(14, 165, 233, 0.8), 0 0 85px rgba(14, 165, 233, 0.7);
        }
      }
      .animate-thinking-pulse {
        animation: thinking-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
      .animate-glow-pulse {
        animation: glow-pulse 2s ease-in-out infinite;
      }

    </style>
  
  </head>
  <body class="text-white selection:bg-sky-500/30">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
