services:
  frontend:
    build:
      context: ./Artificial_Intelligence_Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./Artificial_Intelligence_Frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - ai-network

  backend:
    build:
      context: ./Artificial_Intelligence_Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./Artificial_Intelligence_Backend:/app
      - tts_cache_vol:/app/tts_cache
      - documents_vol:/app/data # Persist uploaded documents outside container
      - /app/.venv
      - ./Artificial_Intelligence_Backend/models:/app/models # Persist TTS models
      - ${USERPROFILE}/.docker/mcp:/root/.docker/mcp:ro # Mount user's MCP config for agent to read
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=postgresql://ai:ai@postgres:5432/ai?options=-csearch_path=ai
      - VECTOR_DB_URL=postgresql+psycopg://ai:ai@postgres:5432/ai?options=-csearch_path=ai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - ai-network

  postgres:
    image: ankane/pgvector
    ports:
      - "5532:5432"
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgvolume_vol:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ai -d ai" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-network

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=2 # Process 2 requests simultaneously
      - OLLAMA_MAX_QUEUE=100 # Queue up to 100 pending requests
      - OLLAMA_FLASH_ATTENTION=1 # Enable Flash Attention for faster inference
      - OLLAMA_KEEP_ALIVE=24h # Keep model in memory for 24 hours
    volumes:
      - ollama_data_vol:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-network

  # MCP Gateway - Docker AI Model Context Protocol Gateway
  # Provides MCP tools for AI agents (no authentication in container mode)
  # Mounts user's local MCP registry so selected servers are available
  mcp-gateway:
    image: docker/mcp-gateway
    ports:
      - "8087:8080"
    command: [ "--transport", "streaming", "--port", "8080", "--watch" ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ai-network

volumes:
  pgvolume_vol:
  ollama_data_vol:
  tts_cache_vol:
  documents_vol:
    # Volume for uploaded documents


networks:
  ai-network:
    driver: bridge
