version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000" # Exposes API on host port 8000
    volumes:
      - tts_cache_vol:/app/tts_cache # Use a named volume for TTS cache
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_RELOAD=0 # Set to 0 for production/container-only environment
      - OLLAMA_BASE_URL=http://ollama:11434
      - KOKORO_TTS_URL=http://kokoro-tts:8880
      - DATABASE_URL=postgresql://ai:ai@postgres:5432/ai
      - VOSK_MODEL_PATH=/app/model/vosk-model-en-us-0.22 # Path inside the container
      # Add any other necessary environment variables for your app
    depends_on:
      ollama:
        condition: service_healthy # Changed from service_started
      kokoro-tts:
        condition: service_healthy
      postgres:
        condition: service_healthy # Wait for postgres to be healthy
    networks:
      - localnet
    # Add a healthcheck for the app service if needed
    healthcheck: # Enabled healthcheck for the app
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s # Give app time to initialize

  ollama:
    image: ollama/ollama
    entrypoint: /bin/sh # Override the default entrypoint
    # Updated command to ensure proper model pulling
    command: >
      -c "ollama serve & PID_SERVE=$! && \\
            echo 'Waiting for Ollama server to initialize...' && sleep 10 && \\
            echo 'Pulling nomic-embed-text model...' && \\
            until ollama pull nomic-embed-text; do echo 'Retrying nomic-embed-text pull...'; sleep 5; done && \\
            echo 'Pulling qwen3:1.7b model...' && \\
            until ollama pull qwen3:1.7b; do echo 'Retrying qwen3:1.7b pull...'; sleep 5; done && \\
            echo 'All models pulled successfully!' && \\
            ollama list && \\
            wait $PID_SERVE"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data_vol:/root/.ollama # Persists Ollama models using a named volume
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    healthcheck: # Updated healthcheck
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q 'nomic-embed-text' && ollama list 2>/dev/null | grep -q 'qwen3:1.7b' && curl -f http://localhost:11434/api/tags"]
      interval: 30s # How often to run the check
      timeout: 20s  # How long to wait for the check to complete
      retries: 10   # How many times to retry before marking as unhealthy
      start_period: 180s # Grace period for Ollama to start and pull models
    networks:
      - localnet

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2 # or ghcr.io/remsky/kokoro-fastapi-gpu:v0.2.2 for GPU
    ports:
      - "8880:8880"
    # If using GPU, uncomment the following:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    container_name: kokoro-tts
    restart: unless-stopped
    networks:
      - localnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/docs"] # Assuming Kokoro has a /docs endpoint
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: ankane/pgvector
    ports:
      - "5532:5432"
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgvolume_vol:/var/lib/postgresql/data # Use a named volume for pgdata
    container_name: pgvector
    restart: unless-stopped
    networks:
      - localnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data_vol: {}
  pgvolume_vol: {}
  tts_cache_vol: {} # Define the tts_cache named volume

networks:
  localnet:
    driver: bridge