<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Teacher Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom Scrollbar Styling */

      /* For Webkit-based browsers (Chrome, Safari, new Edge) */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent; /* Makes the track invisible */
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(75, 85, 99, 0.5); /* Semi-transparent gray-600 */
        border-radius: 20px;
        border: 2px solid transparent;
        background-clip: content-box; /* Clips the background to the content box, creating padding */
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(107, 114, 128, 0.7); /* Semi-transparent gray-500 on hover */
      }

      /* For Firefox */
      html {
        scrollbar-width: thin;
        scrollbar-color: rgba(75, 85, 99, 0.5) transparent; /* thumb color track color */
      }

      /* Custom Avatar Animation */
      @keyframes energetic-hover {
        0%, 100% {
          transform: translateY(0px) rotate(-1deg);
        }
        50% {
          transform: translateY(-12px) rotate(1deg);
        }
      }
      .animate-energetic-hover {
        animation: energetic-hover 5s ease-in-out infinite;
      }

      /* Animations for Speaking State */
      @keyframes floating {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .animate-floating {
        animation: floating 3s ease-in-out infinite;
      }


      /* Floating Aurora Blobs */
      @keyframes aurora-1 {
        0%, 100% { transform: translate(0%, 0%) rotate(0deg); }
        25% { transform: translate(10%, -15%) rotate(45deg); }
        50% { transform: translate(-5%, 10%) rotate(90deg); }
        75% { transform: translate(15%, 5%) rotate(135deg); }
      }
      @keyframes aurora-2 {
        0%, 100% { transform: translate(0%, 0%) rotate(0deg); }
        25% { transform: translate(-10%, 15%) rotate(-45deg); }
        50% { transform: translate(5%, -10%) rotate(-90deg); }
        75% { transform: translate(-15%, -5%) rotate(-135deg); }
      }
       @keyframes aurora-3 {
        0%, 100% { transform: translate(0%, 0%) rotate(0deg); }
        25% { transform: translate(5%, 15%) rotate(30deg); }
        50% { transform: translate(-10%, -5%) rotate(60deg); }
        75% { transform: translate(10%, -10%) rotate(90deg); }
      }

      /* Natural Blinking Animation */
      @keyframes blink {
        0%, 95% { transform: scaleY(1); }
        97.5% { transform: scaleY(0.1); }
        100% { transform: scaleY(1); }
      }
      .eye {
        transform-origin: center;
        animation: blink 7s infinite;
      }
      
      /* Subtle Glance for idle avatar */
      @keyframes subtle-glance {
        0%, 80%, 100% {
          transform: translateX(0);
        }
        85% {
          transform: translateX(-0.8px); /* SVG units */
        }
        95% {
          transform: translateX(0.8px); /* SVG units */
        }
      }
      .animate-subtle-glance {
        animation: subtle-glance 8s infinite ease-in-out;
      }

      /* Thinking pulse for avatar glow */
      @keyframes thinking-pulse {
        0%, 100% {
            transform: scale(0.9);
            opacity: 0.7;
        }
        50% {
            transform: scale(1.1);
            opacity: 1;
        }
      }
       @keyframes glow-pulse {
        0%, 100% {
            box-shadow: 0 0 40px rgba(2, 179, 217, 0.7), 0 0 60px rgba(0, 180, 255, 0.6);
        }
        50% {
            box-shadow: 0 0 55px rgba(2, 179, 217, 0.9), 0 0 85px rgba(0, 180, 255, 0.8);
        }
      }
      .animate-thinking-pulse {
        animation: thinking-pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: center;
      }
      .animate-glow-pulse {
        animation: glow-pulse 2s ease-in-out infinite;
      }

    </style>
