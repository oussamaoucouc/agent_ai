global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

log:
  level: INFO

accessLog:
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: "websecure"
          scheme: "https"

  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true

  file:
    directory: "/etc/traefik/dynamic/"
    watch: true

certificatesResolvers:
  myresolver:
    acme:
      email: "admin@afriprof.com"
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: "web"